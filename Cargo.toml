[package]
name = "bolina"
version = "0.1.0"
edition = "2021"
description = "Bolina protocol head - Rust reference candidate (D-096-A)"

# Zig ReleaseSafe parity: arithmetic keeps bounds/overflow checks ON in release.
# Panic = bug, same contract the Zig head ships.
[profile.release]
debug-assertions = true
overflow-checks = true

[dependencies]
# W1: D-096-A pinned crates (dalek family + RustCrypto), lockfile committed.
ed25519-dalek = "=2.1.1"
x25519-dalek = "=2.0.1"
blake2 = "=0.10.6"
chacha20poly1305 = "=0.10.1"

[dev-dependencies]
hex = "=0.4.3"
hex-literal = "=0.4.1"
