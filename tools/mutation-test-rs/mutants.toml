# Mutantes cirúrgicos para o Bolina Rust
# Cada mutante tem: ficheiro, âncora (texto exacto), substituição, descrição

[[mutants]]
file = "src/codec.rs"
anchor = "if body.len() > MAX_BODY {"
replace = "if body.len() >= MAX_BODY {"
description = "codec: body_len >= instead of > (rejects body at exactly MAX_BODY)"

[[mutants]]
file = "src/codec.rs"
anchor = "if field16.len() > MAX_FIELD16 {"
replace = "if field16.len() >= MAX_FIELD16 {"
description = "codec: field16 >= instead of > (rejects field at exactly max)"

[[mutants]]
file = "src/codec.rs"
anchor = "if field32.len() > MAX_FIELD32 {"
replace = "if field32.len() >= MAX_FIELD32 {"
description = "codec: field32 >= instead of > (rejects field at exactly max)"

[[mutants]]
file = "src/state/intent.rs"
anchor = "if self.entries.len() > MAX_PENDING {"
replace = "if self.entries.len() >= MAX_PENDING {"
description = "state: intent MAX_PENDING + 1 accepted (>= to >)"

[[mutants]]
file = "src/state/intent.rs"
anchor = "if e.state == State::Pending && now_ms > e.admitted_ms + T_PENDING_MS {"
replace = "if e.state == State::Pending && now_ms >= e.admitted_ms + T_PENDING_MS {"
description = "state: intent timeout at exact T_PENDING_MS not expired (>= to >)"

[[mutants]]
file = "src/transport/session.rs"
anchor = "if self.counter >= REKEY_AFTER_MESSAGES { return Err(TransportError::RekeyRequired); }"
replace = "if self.counter > REKEY_AFTER_MESSAGES { return Err(TransportError::RekeyRequired); }"
description = "transport: session rekey at exact threshold not triggered (> to >=)"

[[mutants]]
file = "src/transport/session.rs"
anchor = "if (local_index as usize) >= MAX_SESSIONS { return None; }"
replace = "if (local_index as usize) > MAX_SESSIONS { return None; }"
description = "transport: session index MAX_SESSIONS accepted (> to >=)"

[[mutants]]
file = "src/control.rs"
anchor = "&& self.buf.len() >= SLOWLORIS_SIZE"
replace = "&& self.buf.len() > SLOWLORIS_SIZE"
description = "control: slowloris guard at exact size not triggered (> to >=)"
