# mutation-test-rs: surgical mutants for bolina-rs
# Philosophy: each mutant targets a SPEC invariant, with an anchor that
# matches exactly one occurrence in the source. Equivalent mutants are
# marked and skipped (not counted).

[[mutants]]
domain = "codec"
file = "src/codec.rs"
anchor = "    if parent_count > MAX_PARENTS {"
replacement = "    if parent_count >= MAX_PARENTS {"
description = "parent_count >= instead of > (accepts MAX_PARENTS as valid)"

