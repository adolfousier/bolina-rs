[package]
name = "integration-client"
version = "0.1.0"
edition = "2021"
description = "W12 integration harness client - exercises the bolina daemon over the real execution path (docs/w12-integration-harness-design.md)"

[dependencies]
bolina = { path = "../.." }
# Pinned to the exact bolina crate versions (D-096-A lockfile parity).
ed25519-dalek = "=2.1.1"
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
